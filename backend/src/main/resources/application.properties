# ── Server ──────────────────────────────────────────────
server.port=8081
server.servlet.context-path=/api

# Load local secrets whether Maven is launched from the repo root or backend/.
# Environment variables take precedence over these local files.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# ── MySQL DataSource ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/nintails_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP) ──────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Demo rows rewrite named catalog entries on startup; keep disabled outside local demos.
app.catalog.seed-demo-data=${SEED_DEMO_DATA:false}

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deployment}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset-password-on-startup=${ADMIN_PASSWORD_RESET_ON_STARTUP:false}
app.admin.reset-url=${ADMIN_PASSWORD_RESET_URL:http://localhost:5500/Home/Admin.html}
app.customer.reset-url=${CUSTOMER_PASSWORD_RESET_URL:http://localhost:5500/Home/Home.html}

# ── Administrator password reset email ───────────────────
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}

# ── Razorpay ─────────────────────────────────────────────
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ── File Upload ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
app.upload.directory=${APP_UPLOAD_DIRECTORY:uploads/products}
app.upload.evidence-directory=${APP_EVIDENCE_UPLOAD_DIRECTORY:uploads/order-evidence}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8081/api}

# ── Logging — clean terminal output ──────────────────────
logging.level.com.nintails=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.deprecation=OFF
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.web=WARN
