# ── Server ──────────────────────────────────────────────
server.port=8081
server.servlet.context-path=/api

# ── MySQL DataSource ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/nintails_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool (HikariCP) ──────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deployment}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── File Upload ──────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging — clean terminal output ──────────────────────
logging.level.com.nintails=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.deprecation=OFF
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.web=WARN
