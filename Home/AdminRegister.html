<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eafdf8">
    <link rel="icon" type="image/svg+xml" href="../Assets/9tails-logo.svg">
    <link rel="stylesheet" href="Admin.css">
    <title>Register Administrator | 9Tails</title>
    <script>window.TAP_API_TOKEN_KEY = 'tap_admin_jwt';</script>
    <script defer src="api.js"></script>
    <script defer src="AdminRegister.js"></script>
</head>
<body>
    <main class="admin-page">
        <section class="admin-login-card admin-registration-card">
            <a class="brand-mark" href="Admin.html"><span>9</span> Tails</a>
            <span class="eyebrow">Administrator accounts</span>
            <h1>Register an administrator</h1>
            <p>This page is available only to a signed-in administrator. New accounts can access store-wide administration.</p>
            <p class="feedback-message" id="adminRegistrationAccess" role="status"></p>
            <form id="adminRegistrationForm" class="hidden">
                <label for="newAdminEmail">Administrator email</label>
                <input id="newAdminEmail" type="email" autocomplete="email" maxlength="254" required>
                <label for="newAdminPassword">Temporary password (at least 12 characters)</label>
                <input id="newAdminPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required>
                <button class="primary-button" id="adminRegistrationButton" type="submit">Create administrator account</button>
            </form>
            <p class="feedback-message" id="adminRegistrationFeedback" role="alert"></p>
            <a class="back-link" href="Admin.html">← Back to Admin sign-in / dashboard</a>
        </section>
    </main>
</body>
</html>
